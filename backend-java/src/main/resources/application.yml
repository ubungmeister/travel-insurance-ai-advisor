server:
  port: ${BACKEND_PORT:8000}

spring:
  application:
    name: ai-advisor

  # Database connection (Supabase Postgres). Provided via env vars so they stay
  # out of source control and don't clash with the Python app's DATABASE_URL
  # format. Spring binds these automatically:
  #   SPRING_DATASOURCE_URL=jdbc:postgresql://POOLER_HOST:5432/postgres
  #   SPRING_DATASOURCE_USERNAME=postgres.PROJECT_REF
  #   SPRING_DATASOURCE_PASSWORD=YOUR_PASSWORD

  jpa:
    # Schema is owned by Alembic; Hibernate only verifies the entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    # Baseline the existing Alembic-managed schema without changing it. No
    # versioned migrations are applied yet (Alembic still owns migrations).
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Existing Alembic-managed schema"

# CORS origins for the Vite frontend. Override with APP_CORS_ALLOWED_ORIGINS
# (comma-separated) if the frontend is served from other hosts.
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
